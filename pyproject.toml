[project]
name = "myagent"
version = "0.1.0"
description = "A lightweight, interview-friendly ReAct agent runtime."
readme = "MYAGENT_ROADMAP.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "rich>=13.0.0,<14.0.0",
    "httpx>=0.27.0,<1.0.0",
    "lark-oapi>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[project.scripts]
myagent = "myagent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
